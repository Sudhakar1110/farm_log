[project]
name = "fleet_log"
version = "0.1.0"
description = "Vehicle trips, odometer readings, fuel logging and fuel yield (mileage) tracking for Frappe v15. Runs standalone on Frappe and auto-detects ERPNext v15 for deep integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Fleet Log Contributors" },
]
dependencies = [
    "frappe>=15.0.0,<16.0.0",
    # Frappe v15 declares gunicorn as a git URL dependency. uv (used by
    # bench >= 5.29) refuses transitive URL dependencies, so it must be
    # declared here as a direct requirement. Keep the commit in sync with
    # frappe's version-15 branch.
    "gunicorn @ git+https://github.com/frappe/gunicorn@bb554053bb87218120d76ab6676af7015680e8b6",
]

[tool.bench]
installer = "pip"

[tool.bench.app]
app_name = "fleet_log"
